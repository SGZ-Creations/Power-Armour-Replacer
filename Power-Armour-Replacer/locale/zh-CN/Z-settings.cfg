[mod-setting-description]
#Armour
ShortcutTech=ON：\n无需研究即可解锁（使所有快捷键默认为 API）\n\nOFF：\n将原版解锁转换为需要 PA&R 对应科技等级才能解锁，而非原版（不过 PA&R 已禁用原版）。
Durability=[color=green]装甲耐久度OFF：关闭装甲耐久度[/color]\n\n\n\n[color=yellow]装甲耐久度全部：此设置对所有装甲应用一个统一值，使用黄色设置[/color]\n\n\n\n[color=red]装甲耐久度单独：逐件设置装甲耐久度[/color]
SingleArmourDurabilitySetting=为所有装甲设置相同的耐久度值。
EquipmentMulti=允许设置下一等级配方中使用的装备数量。应用于本模组所有装备。
#Vanilla
vanilla-filters=启用/禁用过滤器（库存中鼠标中键）\n开启隐藏过滤器。\n关闭显示过滤器。
OptionalTech6Texture=新的科技 6 纹理有两个我喜欢的版本，但其中一个更好，不过仍不够完美，因此两者都包含了，其中一个放在此设置下。
HideRecipesFromPlayer=勾选显示配方。\n取消勾选隐藏配方。
#SA or MechMod
MK10RecipeTech=将 [item=mech-armour] 的需求移至 MK10 科技，并修改配方使用 MK10。

#Bob's
BobW-filters=启用/禁用过滤器（库存中鼠标中键）\n开启隐藏过滤器。\n关闭显示过滤器。

#--||--
BobE-filters=启用/禁用过滤器（库存中鼠标中键）\n开启隐藏过滤器。\n关闭显示过滤器。

