[item-description]
par-nightvision-mk1=第一代夜视仪使用了劣质组件，因此需要 75% 的黑暗度才能工作——原因不明。但仍然比那些被某个聪明人丢进回收机的出租货强 25%。只是别让主人知道你把他的夜视仪回收了。

par-nightvision-mk2=第二代版本我们决定改进功耗，相比第一代居然用掉 125GW（我们也不知道怎么做到的），虽然没用相同的零件，但我们对旧型号进行了改进，成功将功耗降低，且仅需 35% 黑暗度即可激活。不过旧型号的部分零件仍导致高能耗，似乎改善了激活条件。

