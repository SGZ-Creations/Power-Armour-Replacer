[tips-and-tricks-item-description]
power-armour-replacer=感谢使用 Power Armour & Replacer。\n\n\n如果您愿意贡献图形（包括制作和科技变体），以下是我在 0.4.x(17) 版本中需要的：\n3 款新装甲 + 科技，共 6 个\n9 款新电击防御（放电防御）+ 科技，共 18 个\n4 款新机甲装甲 + 科技，共 8 个\n4 款新传送带装备 + 科技，共 8 个\n4 款新裂变反应堆 + 科技，共 8 个\n\n\n如果您愿意提供纹理，我们将不胜感激，您的贡献将列入模组致谢页面。

par_info=Power Armour & Replacer（简称 PA&R）可在原版中运行，但并非为原版设计，不过仍然可玩。\n\nPA&R 提供装甲和装备，现在可通过新提供的设置进行调整，使其按您的方式工作。它依然旨在与其他大修模组配合使用（配方方面采用默认 PAR 模组设置）。这意味着如果您在原版中使用，不调整的话会让您变得过于强大。物品成本较低，且游戏中可用物品有限（太空时代对此有所帮助）。\n\n所有装甲的抗性属性将保持不变，且我不会对其进行更改（欢迎其他模组为其添加设置），因为本模组特意设计为强力的，高成本是预料之中的，但在非大修模组包中可能难以获取。\n\n如果您仍想调整一些内容？CAS（CA&S）允许您调整和更改 PA&R 装甲的网格和背包加成，如果它们对您来说太大。\n\nPA&R 需要 CAS，因此它应在您的模组列表中，以便轻松调整。\n非常感谢您的阅读。

par_base-info=PA&R 隐藏并禁用了基础/原版装甲和装备的机制。\n如果启动设置 [原版过滤器] 被关闭，则过滤器会被隐藏。\nPower Armour & Replacer 在原版中可运行，但并非为原版设计。\n\n\n\nPA&R 修改了原版科技，使其成为触发科技而非研究科技。原因是为了引入原版的制作触发系统，直到您解锁 MK1 装甲和装备，之后其余应恢复默认……祝好运。

par_SpaceAge-info=PA&R 将 MK2 装甲替换为 MK5 装甲，以引入新的“石棺”（战锤）。

par_bobwarfare-info=PA&R 隐藏并禁用了“Bobs Warfare”的装甲机制（装甲被禁用、隐藏）。\n如果启动设置 [Bob's Warfare 过滤器] 被关闭，则过滤器会被隐藏。

par_bobequipment-info=PA&R 隐藏并禁用了“Bobs Equipment”的装备机制（装备被禁用、隐藏）。\n如果启动设置 [Bob's Equipment 过滤器] 被关闭，则过滤器会被隐藏。\n迁移完成后该模组已无用，您现在可以安全移除它。迁移窗口会显示，除非您刚开新档。

par_foliax-info=Foliax Planet 添加了自己的原版科技，PA&R 为保持 UI 整洁将其移除。\n\n计划在未来添加一些科技和配方更改以与 Foliax Planet 配合工作，如果启动设置中的 Foliax 设为“True”，否则您将在 Nouvis 上获得所有内容。\n\n注意：这些更改将在稍后实现。欢迎您通过 GIT PR 或上传到 Discord 提出科技和配方进度的建议。

par_ColdBitters-info=PA&R 隐藏并禁用了“Cold Biiters”的装甲。\n可收集的霜冻物品仍然可用，并在 PA&R 的部分配方中需要。

par_custom_power_armor_fix-info=PA&R 隐藏并禁用了“Custom Power Armour fix's”的装甲和装备机制。\n如果启动设置 [Custom Power Armour fix 过滤器] 被关闭，则过滤器会被隐藏。\n此模组有一些炮塔装备可供玩耍。

par_MetalStars-info=PA&R 在其流程中集成了原型机甲装甲，您应该已经从配方中需要装甲 MK3 这一点看出来了。升级到常规机甲装甲时，请注意在 Fulgora 上保留一件。
parE_MetalStars-info=PARs-SpaceAge-Extension 移除了原型机甲装甲，并替换为它自己的机甲装甲等级。

par_darkstar_utilities_fixed-info=PA&R 隐藏并禁用了“Darkstar-fixed”的装甲和装备机制。\n如果启动设置 [Darkstar 过滤器] 被关闭，则过滤器会被隐藏。

spidertrontiers_community_updates-info_2=PA&R 出于兼容性对配方进行了修改。

par_hiladdar_gear-info=PA&R 隐藏并禁用了“Hiladdar_Gear mod”的装甲、装备、科技和中间产物。\n如果启动设置 [Hiladdar_Gear 过滤器] 被关闭，则过滤器会被隐藏。

par_FireProofMechSuit-info=PA&R 对防火机甲装甲进行了更改。现在它将在与常规机甲装甲相同的科技线上解锁，但不是在 Fulgora 获取，而是通过前往 Vulcanus 获得。配方会根据您使用的其他模组（如 MetalStars、RampantArsenalFork）进行调整。

par_power_armor_mk3-info=PA&R 隐藏并禁用了 Power Armor MK3 的装甲和装备机制。\n如果启动设置 [MK3 过滤器] 被关闭，则过滤器会被隐藏。\nPA&R 已将此模组的实用背心作为其流程的一部分集成，以略微扩展游戏初期，并修改了其配方。物品已移至 PAR 的制作 UI 以便更好整理。

par_power_and_armor-info=PA&R 隐藏并禁用了 PowerAndArmor 的装甲和装备机制。\n此模组已无任何需要启用的内容。

par_rampant-arsenal-info=PA&R 隐藏并禁用了 RampantArsenal 或 RampantArsenalFork 的装甲和装备机制。\n如果启动设置 [Arsenal 过滤器] 被关闭，则过滤器会被隐藏。物品已移至 PAR 的制作 UI 以便更好整理。RampantArsenalFork 引入了机甲装甲，已与 PA&R 集成。

par_k2-se-info=[K2-SE/SE-K2 模式]：\nPA&R 隐藏并禁用了 SE 和 K2 的装甲和装备机制。\n所有物品应在 K2 中隐藏。SE 和 K2 的配方兼容性还有待进一步工作。\n如果启动设置 [KE 过滤器] 被关闭，则过滤器会被隐藏。

par_se-info=[仅太空探索模式]：\nPA&R 隐藏并禁用了 SE 的装甲和装备机制。\n如果启动设置 [SE 过滤器] 被关闭，则过滤器会被隐藏。\nSE 兼容性还有很多工作要做。如果没有玩家来告诉我具体需要实现什么并进行测试，我不会主动去处理。

par_k2-info=[仅 Krastorio2 模式]：\nPA&R 隐藏并禁用了 Krastorio 的装甲和装备机制。\n如果启动设置 [Krastorio 过滤器] 被关闭，则过滤器会被隐藏。\n所有物品应在 K2 中隐藏。兼容性已完全或部分完成。

Nanobots3-info=Nanobots3 的所有物品/装备已移至 PAR 的制作 UI 以便更好整理。所有 Nanobots3 装备现已在夜视免疫 MK1 处解锁。

par_insectitron-info=Insectitronics 模组目前应能正常工作。

par_space-x-info=SpaceModFeorasFork 已被 PA&R 模组修改。如果您发现 PA&R 的兼容性问题，请在 Discord 上报告。

par_ProgressiveNVGsFork-info=ProgressiveNVGsFork 已被隐藏、禁用并迁移。此模组已无剩余内容。对此带来的不便深表歉意，但这正是此模组的用途。

par_teleportation-equipment-info=TeleportationEquipment 模组已被 PA&R 模组修改了科技。如果您发现 PA&R 的兼容性问题，请在 Discord 上报告。\nPA&R 已将该科技移至与默认不同的位置，并修改了科技包类型和消耗。物品已移至 PAR 的制作 UI 以便更好整理。

par_osm-radioactivity-info=osm-radioactivity 应能正常工作。如果您发现 PA&R 的兼容性问题，请在 Discord 上报告。